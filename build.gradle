plugins {
    id 'fabric-loom' version '1.17.2'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/main/resources/astra.accesswidener")
}

repositories {
    flatDir {
        dirs 'lib'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly name: 'baritone-api-fabric-1.11.2'
    modImplementation name: '游戏内账号切换-IAS-9.0.6+1.21.1-fabric'
    modImplementation name: 'satin-2.0.0'

    implementation 'org.apiguardian:apiguardian-api:1.1.2'

    include name: '游戏内账号切换-IAS-9.0.6+1.21.1-fabric'
    include name: 'satin-2.0.0'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    options.compilerArgs << "-Xmaxerrs" << "2048"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}